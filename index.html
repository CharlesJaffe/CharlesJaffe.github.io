<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charles Jaffé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0e1116;
    --glass: rgba(14, 17, 22, 0.62);
    --glass-edge: rgba(237, 230, 218, 0.35);
    --cream: #ede6da;
    --cream-dim: rgba(237, 230, 218, 0.72);
    --sky: #6fb8c9;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    min-height: 100vh;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', Georgia, serif;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 1600px;
    line-height: 0; /* kill inline-image gap */
  }

  .stage img {
    display: block;
    width: 100%;
    height: auto;
  }

  /* ---- signature, bottom right ---- */
  .signature {
    position: absolute;
    right: 2.4%;
    bottom: 2.4%;
    text-align: right;
    padding: 0.55em 0.85em;
    line-height: 1.35;
    background: #0a0c10;
    border-radius: 3px;
  }

  .signature .name {
    display: block;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(0.85rem, 1.6vw, 1.35rem);
    color: var(--cream);
  }

  .signature .email {
    display: block;
    font-size: clamp(0.6rem, 1vw, 0.85rem);
    letter-spacing: 0.03em;
    color: var(--cream-dim);
  }

  .signature .email a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid rgba(237, 230, 218, 0.28);
    transition: border-color 0.25s ease, color 0.25s ease;
  }

  .signature .email a:hover,
  .signature .email a:focus-visible {
    color: var(--cream);
    border-color: rgba(237, 230, 218, 0.85);
  }

  /* ---- the window, positioned exactly over the painted window ---- */
  .window {
    position: absolute;
    left: 2.74%;
    top: 6.15%;
    width: 15.20%;
    height: 41.96%;
  }

  .window-frame {
    position: absolute;
    inset: 0;
    background: linear-gradient(155deg, #e8d8c9 0%, #cbab93 45%, #93725a 100%);
    border-radius: 2px;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.5),
      inset 0 0 0 1px rgba(255,255,255,0.15);
  }

  .window-glass {
    position: absolute;
    inset: 6% 7%;
    border-radius: 1px;
    background:
      linear-gradient(135deg,
        rgba(120, 165, 180, 0.35) 0%,
        rgba(14, 17, 22, 0.72) 22%,
        rgba(14, 17, 22, 0.9) 60%,
        rgba(20, 26, 33, 0.85) 100%);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.6);
    overflow: hidden;
  }

  /* faint diagonal glint sweeping the pane */
  .window-glass::before {
    content: "";
    position: absolute;
    top: -40%;
    left: -60%;
    width: 55%;
    height: 220%;
    background: linear-gradient(
      100deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0.16) 48%,
      rgba(255,255,255,0) 100%
    );
    transform: rotate(8deg);
    transition: left 1.1s ease;
    pointer-events: none;
  }

  .window:hover .window-glass::before,
  .window:focus-within .window-glass::before {
    left: 130%;
  }

  @media (prefers-reduced-motion: reduce) {
    .window-glass::before { transition: none; }
  }

  .window a {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    text-decoration: none;
    color: var(--cream-dim);
    font-style: italic;
    font-weight: 500;
    letter-spacing: 0.02em;
    font-size: clamp(0.62rem, 1.15vw, 1.05rem);
    line-height: 1.15;
    text-shadow: 0 0 8px rgba(0,0,0,0.6);
    transition: color 0.3s ease, text-shadow 0.3s ease;
  }

  .window a:hover,
  .window a:focus-visible {
    color: var(--cream);
    text-shadow: 0 0 14px rgba(237, 230, 218, 0.55), 0 0 4px rgba(0,0,0,0.7);
  }

  .window a:focus-visible {
    outline: 1px solid var(--cream-dim);
    outline-offset: 3px;
  }

  /* sill */
  .window-sill {
    position: absolute;
    left: -6%;
    right: -6%;
    bottom: -7%;
    height: 9%;
    background: linear-gradient(180deg, #b8987e 0%, #7d5c46 100%);
    box-shadow: 0 2px 6px rgba(0,0,0,0.45);
    border-radius: 1px;
  }
</style>
</head>
<body>

  <div class="stage">
    <img src="mural-web.jpg" alt="A geometric mural of two horses in blue, teal, rust, and orange, painted on an exterior wall.">

    <div class="window">
      <div class="window-sill"></div>
      <div class="window-frame"></div>
      <div class="window-glass"></div>
      <a href="genealogy.html">Genealogy</a>
    </div>

    <div class="signature">
      <span class="name">Charles Jaffé</span>
      <span class="email"><a href="mailto:cjaffe@cjaffe.org">cjaffe@cjaffe.org</a></span>
    </div>
  </div>

</body>
</html>
