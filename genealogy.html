<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genealogy — Charles Jaffé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #ede6da;
    --cream-dim: rgba(237, 230, 218, 0.78);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Cormorant Garamond', Georgia, serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1410 url('bark-web.jpg') center center / cover no-repeat;
    position: relative;
    text-align: center;
    padding: 1.5rem;
  }

  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 100%);
  }

  .content {
    position: relative;
    max-width: 32rem;
  }

  .eyebrow {
    font-style: normal;
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--cream-dim);
    margin: 0 0 1rem;
  }

  h1 {
    font-style: italic;
    font-weight: 500;
    font-size: clamp(2rem, 5vw, 3rem);
    color: var(--cream);
    margin: 0 0 0.75rem;
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
  }

  p {
    font-size: clamp(1rem, 2vw, 1.2rem);
    color: var(--cream-dim);
    margin: 0 0 2rem;
    line-height: 1.5;
  }

  a.back {
    display: inline-block;
    font-style: italic;
    font-size: 0.95rem;
    color: var(--cream-dim);
    text-decoration: none;
    border-bottom: 1px solid rgba(237, 230, 218, 0.35);
    padding-bottom: 2px;
    transition: color 0.25s ease, border-color 0.25s ease;
  }

  a.back:hover,
  a.back:focus-visible {
    color: var(--cream);
    border-color: rgba(237, 230, 218, 0.85);
  }
</style>
</head>
<body>
  <div class="content">
    <p class="eyebrow">Roots</p>
    <h1>Still tracing the branches.</h1>
    <p>This part of the site is under construction. Check back soon.</p>
    <a class="back" href="index.html">&larr; Back home</a>
  </div>
</body>
</html>
